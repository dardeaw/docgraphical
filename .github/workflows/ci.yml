name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -e .

      - name: Lint (both packages, fatal errors only)
        run: |
          flake8 docgraph docgraphical --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Byte-compile all modules
        run: |
          python -m compileall -q docgraph docgraphical

      - name: Run Unit Tests
        run: |
          pytest -q

  frontend:
    name: Frontend syntax (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check browser bundle
        run: |
          node --check static/docgraph.js

      - name: Verify Electron copy is byte-identical
        run: |
          cmp static/docgraph.js app/static/docgraph.js
          cmp static/docgraph.css app/static/docgraph.css
          cmp templates/index.html app/index.html
