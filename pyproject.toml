[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docgraphical"
version = "1.0.0"
authors = [
  { name="Chunghsing Tech / CodeGraph Team", email="a1081@chenbro.com" },
]
description = "Deterministic Markdown AST analyzer, TOC outline & surgical section slicer for AI Agents. Save 97% tokens."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["docgraphical", "docgraph", "markdown", "ast", "toc", "ai-agent", "mcp", "llm-tokens", "rag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.0.0", "flake8>=6.0.0"]

[project.urls]
"Homepage" = "https://github.com/dardeaw/docgraphical"
"Bug Tracker" = "https://github.com/dardeaw/docgraphical/issues"

[project.scripts]
docgraphical = "docgraphical.cli:main"
docg = "docgraphical.cli:main"
docgraph = "docgraphical.cli:main"
